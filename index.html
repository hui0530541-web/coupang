<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추천 상품 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --card-bg: #ffffff;
    --accent: #ff4444;
    --accent2: #ff8800;
    --text-main: #1a1a1a;
    --text-sub: #666;
    --border: #e8e4dc;
    --badge-bg: #fff3cd;
    --badge-text: #8a5c00;
    --tag-bg: #ffeaea;
    --tag-text: #cc2222;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
  }

  /* 헤더 */
  .header {
    background: #fff;
    border-bottom: 1.5px solid var(--border);
    padding: 20px 16px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }

  .header p {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  /* 카테고리 필터 */
  .filter-wrap {
    padding: 12px 16px 0;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    -ms-overflow-style: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .filter-wrap::-webkit-scrollbar { display: none; }

  .filter-btn {
    display: inline-block;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-sub);
    cursor: pointer;
    margin-right: 6px;
    transition: all 0.18s;
    white-space: nowrap;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* 갤러리 그리드 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
  }

  /* 상품 카드 */
  .card {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }

  .card:active {
    transform: scale(0.97);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }

  .card-img-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    background: #f5f3ef;
    overflow: hidden;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #f5f3ef 0%, #ede9e0 100%);
  }

  .card-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: 0.02em;
  }

  .card-badge.sale {
    background: var(--accent2);
  }

  .card-body {
    padding: 10px 10px 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .card-category {
    font-size: 10px;
    color: var(--text-sub);
    font-weight: 500;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }

  .card-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.4;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }



  .card-cta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 7px 0;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  /* 안내 텍스트 */
  .notice {
    text-align: center;
    font-size: 11px;
    color: var(--text-sub);
    padding: 4px 16px 24px;
    line-height: 1.7;
  }

  .notice a {
    color: var(--accent);
    text-decoration: none;
  }

  /* 숨김 처리 */
  .card[data-cat].hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  
  <h1>오늘의 추천 상품</h1>
  <p>쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</div>

<div class="filter-wrap">
  <button class="filter-btn active" onclick="filterCat('all')">전체</button>
  <button class="filter-btn" onclick="filterCat('주방')">주방</button>
  <button class="filter-btn" onclick="filterCat('생활')">생활</button>
  <button class="filter-btn" onclick="filterCat('뷰티')">뷰티</button>
  <button class="filter-btn" onclick="filterCat('전자')">전자기기</button>
  <button class="filter-btn" onclick="filterCat('건강')">건강</button>
  <button class="filter-btn" onclick="filterCat('식품')">식품</button>
</div>

<div class="gallery" id="gallery">
  <!-- ✏️ 상품 추가 방법:
       아래 카드 블록을 복사해서 붙여넣고
       링크, 이미지, 상품명, 카테고리, 배지만 바꿔주세요!
  -->

  <a class="card" data-cat="주방" href="https://쿠팡파트너스링크1" target="_blank" rel="noopener">
    <div class="card-img-wrap">
      <div class="card-img-placeholder">🍳</div>
      <span class="card-badge">추천</span>
    </div>
    <div class="card-body">
      <div class="card-category">주방</div>
      <div class="card-name">테팔 인덕션 프라이팬 28cm 에버쿡</div>
      <div class="card-cta">상품 보러가기</div>
    </div>
  </a>

</div>

<p class="notice">
  이 포스팅은 쿠팡 파트너스 활동의 일환으로,<br>
  이에 따른 일정액의 수수료를 제공받습니다.
</p>

<script>
function filterCat(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  document.querySelectorAll('.card[data-cat]').forEach(card => {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.classList.remove('hidden');
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>

</body>
</html>
